name: Trigger Vercel Deploys

on:
  push:
    branches:
      - "all/*"
      - "dev"
      - "master"
      - "rosen/*"
      - "guard/*"
      - "watcher/*"


jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ROSEN_PROJECT_ID: ${{ secrets.ROSEN_PROJECT_ID }}
      GUARD_PROJECT_ID: ${{ secrets.GUARD_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      WATCHER_PROJECT_ID: ${{ secrets.WATCHER_PROJECT_ID }}

      ROSEN_PROJECT: ${{ secrets.ROSEN_PROJECT_NAME }}
      GUARD_PROJECT: ${{ secrets.GUARD_PROJECT_NAME }}
      WATCHER_PROJECT: ${{ secrets.WATCHER_PROJECT_NAME }}
      REPO_ID: ${{ github.event.repository.id }}
      REF:     ${{ github.ref_name }}
      SHA:     ${{ github.sha }}
      AUTHOR:  ${{ github.event.head_commit.author.name }}
      EMAIL:   ${{ github.event.head_commit.author.email }}
      MSG:     ${{ github.event.head_commit.message }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

    # rest api
      - name: Deploy rosen app
        if: ${{ github.ref_name == 'dev' || github.ref_name == 'master' || startsWith(github.ref_name, 'all/') || startsWith(github.ref_name, 'rosen/') }}
        run: |
          curl -sS -X POST https://api.vercel.com/v13/deployments \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"$ROSEN_PROJECT\",
                  \"gitSource\": {
                    \"type\": \"github\",
                    \"repoId\": $REPO_ID,
                    \"ref\": \"$REF\",
                    \"sha\": \"$SHA\"
                  }
                }"

      - name: Deploy guard app
        if: ${{ github.ref_name == 'dev' || github.ref_name == 'master' || startsWith(github.ref_name, 'all/') || startsWith(github.ref_name, 'guard/') }}
        run: |
          curl -sS -X POST https://api.vercel.com/v13/deployments \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"$GUARD_PROJECT\",
                  \"gitSource\": {
                    \"type\": \"github\",
                    \"repoId\": $REPO_ID,
                    \"ref\": \"$REF\",
                    \"sha\": \"$SHA\"
                  }
                }"

      - name: Deploy watcher app
        if: ${{ github.ref_name == 'dev' || github.ref_name == 'master' || startsWith(github.ref_name, 'all/') || startsWith(github.ref_name, 'watcher/') }}
        run: |
          curl -sS -X POST https://api.vercel.com/v13/deployments \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"$WATCHER_PROJECT\",
                  \"gitSource\": {
                    \"type\": \"github\",
                    \"repoId\": $REPO_ID,
                    \"ref\": \"$REF\",
                    \"sha\": \"$SHA\"
                  }
                }"

